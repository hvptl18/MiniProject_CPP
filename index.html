<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    background: linear-gradient(135deg, #0f172a, #020617);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.container{
    width:400px;
    background:rgba(15, 23, 42, 0.9);
    border:1px solid #00ffff;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,255,255,0.4);
}

h1{
    color:#00ffff;
    margin-bottom:20px;
    text-shadow:0 0 10px #00ffff;
}

button{
    padding:12px 20px;
    margin:8px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
    box-shadow:0 0 15px white;
}

button:nth-child(1){
    background:#00c3ff;
    color:black;
}

button:nth-child(2){
    background:#00ff99;
    color:black;
}

button:nth-child(3){
    background:#ff00ff;
    color:white;
}

p{
    margin-top:10px;
    font-size:18px;
}

#result{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
    color:#00ffff;
    text-shadow:0 0 8px #00ffff;
}

h3{
    margin-top:15px;
    color:#ffffff;
}
</style>
